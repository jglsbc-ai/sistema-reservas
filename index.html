<style>

.drop.open{display:block}
.drop button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:8px 12px;border-radius:8px}

.drop .who{padding:8px 12px;color:var(--muted);font-size:.85rem;border-bottom:1px solid var(--bar);margin-bottom:4px}

.top #logo{max-height:34px;max-width:120px;object-fit:contain}
.uinfo{font-size:.75rem;line-height:1.2;color:var(--muted);text-align:right}.uinfo b{color:var(--text)}
.dia{background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 45%,var(--bar));border-radius:14px;margin:10px 0;overflow:hidden}
.dh{background:var(--bar);text-align:center;padding:8px}.dh small{color:var(--muted);display:block}
.db{padding:6px 10px}.nada{text-align:center;color:var(--muted);margin:10px 0}
.mini{border:0;background:var(--bar);color:var(--text);border-radius:999px;padding:5px 12px}
.mini:hover{filter:brightness(.95)}
.badge{border-radius:999px;padding:1px 10px;font-size:.75rem}.badge.bq{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.rdata{color:var(--muted);margin:10px 0}
.atalhos{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}

<body>

<dialog id="dlg"></dialog>

<script>
"use strict";
/* ================= Conexão ================= */
const API="https://aqfkqvdcyaymyccmemih.supabase.co";
const KEY="sb_publishable_IFPdMmyIfOSfnwo5-gtnvw_eXz0Yn5B";

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brd=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
const hh=t=>String(t).slice(0,5);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoje=()=>ymd(new Date());
const saudacao=()=>{const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"};
const somaDias=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const NIVEL={criador:"Criador",gerente:"Gerente",atendente:"Atendente",financeiro:"Financeiro",agencia:"Agência"};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function traduz(m){
  m=String(m||"");
  const t=[["Invalid login credentials","E-mail ou senha incorretos"],["Email not confirmed","Confirme seu e-mail antes de entrar (veja a caixa de entrada)"],["User already registered","Este e-mail já está cadastrado"],["usuarios_email_unico","Já existe um usuário com este e-mail"],["agencias_nome_unico","Já existe uma agência com esse nome"],["exclusion constraint","Já existe um período de tarifa que se sobrepõe a essas datas"],["row-level security","Sem permissão para esta ação"],["Failed to fetch","Sem conexão com o servidor"],["NetworkError","Sem conexão com o servidor"],["Password should be","A senha precisa ter pelo menos 6 caracteres"],["rate limit","Muitas tentativas. Aguarde um pouco e tente de novo"]];
  for(const [a,b] of t)if(m.includes(a))return b;
  return m;
}

/* ================= Sessão e chamadas ================= */
let S=null;try{S=JSON.parse(ls.get("sb_sess")||"null")}catch(e){}
const saveS=s=>{S=s;s?ls.set("sb_sess",JSON.stringify(s)):ls.del("sb_sess")};
const norm=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user});
let renovando=null;
function renova(){
  if(!S||!S.refresh_token)return Promise.reject(new Error("Sessão expirada"));
  renovando=renovando||fetch(API+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:S.refresh_token})})
    .then(async r=>{const j=await r.json();if(!r.ok){saveS(null);throw new Error("Sessão expirada")}saveS(norm(j))})
    .finally(()=>{renovando=null});
  return renovando;
}
async function http(path,o={},retry=true){
  if(S&&S.expires_at-Date.now()/1000<60){try{await renova()}catch(e){sair();throw e}}
  const h={apikey:KEY,...(o.headers||{})};
  if(S)h.Authorization="Bearer "+S.access_token;
  let body;
  if(o.raw)body=o.body;else if(o.body!==undefined){h["Content-Type"]="application/json";body=JSON.stringify(o.body)}
  if(o.prefer)h.Prefer=o.prefer;
  let r;
  try{r=await fetch(API+path,{method:o.method||"GET",headers:h,body})}catch(e){throw new Error(traduz(e.message))}
  if(r.status===401&&retry&&S){try{await renova()}catch(e){sair();throw e}return http(path,o,false)}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error(traduz((j&&(j.message||j.msg||j.error_description||(typeof j.error==="string"&&j.error)))||t||("Erro "+r.status)));
  return j;
}
const rest=q=>http("/rest/v1/"+q);
const ins=(t,o)=>http("/rest/v1/"+t,{method:"POST",body:o,prefer:"return=representation"});
const upd=async(t,f,o)=>{const r=await http("/rest/v1/"+t+"?"+f,{method:"PATCH",body:o,prefer:"return=representation"});if(Array.isArray(r)&&!r.length)throw new Error("Nada foi alterado (sem permissão ou registro inexistente)");return r};
const rpc=(n,a)=>http("/rest/v1/rpc/"+n,{method:"POST",body:a||{}});

/* ================= Estado ================= */
let ME=null,ATR=null,PLAT=false,ATV=null,HOR=[],AGS=[],CFGAL={ativo:true,som:true,intervalo_segundos:30,tipos:["gerente","atendente"]};
let view="home",day=hoje(),sub={},RES={},mostraCanc=false,PERS={},cfgMode=false;
const equipe=()=>["criador","gerente","atendente"].includes(ME.tipo);
const gestao=()=>["criador","gerente"].includes(ME.tipo);
const fin=()=>["criador","gerente","financeiro"].includes(ME.tipo);
const rec=k=>!ATR||!ATR.recursos||ATR.recursos[k]!==false;
const RECMAP={mp:"multiponto",f_mp:"multiponto",estat:"estatisticas",agenda:"mapa_vagas",registros:"registros"};
const agGer=()=>ME.tipo==="agencia"&&ME.gerente_agencia===true;
const agNome=id=>{const a=AGS.find(x=>x.id===id);return a?a.nome_fantasia:"—"};

/* ================= Modal ================= */
const dlg=$("#dlg");
function ask(titulo,campos,ok,fn,extra){

/* ================= Login ================= */
function telaLogin(aviso){
  const modo="entrar";
  $("#app").innerHTML=`<div class="login"><aside class="side"><div class="lgbrand">Sistema de reservas</div><div class="lgwel"><h2>${modo==="entrar"?"Bem-vindo":"Primeiro acesso"}</h2><p>Reservas e passeios em um só lugar.</p></div></aside><main class="main"><div class="box">
  <h1>Sistema de reservas</h1><p>${modo==="entrar"?"Entre com seu e-mail e senha":"Primeiro acesso: crie o login do Criador do sistema"}</p>
  <form id="lf">
    <label>E-mail<input type="email" id="le" autocomplete="username" required></label>
    <label>Senha<input type="password" id="ls" autocomplete="${modo==="entrar"?"current-password":"new-password"}" minlength="6" required></label>
    <p class="err" id="lm">${esc(aviso||"")}</p>
    <button class="pri">${modo==="entrar"?"Entrar":"Criar login"}</button>
  </form>
  </div></main></div>`;
  brandLogin();
  $("#lf").onsubmit=async e=>{
    e.preventDefault();const b=$("#lf .pri");b.disabled=true;$("#lm").textContent="";
    const email=$("#le").value.trim(),senha=$("#ls").value;
    try{
      if(modo==="criar"){
        const j=await http("/auth/v1/signup",{method:"POST",body:{email,password:senha}});
        if(j&&j.access_token){saveS(norm(j));return boot()}
        return telaLogin("Login criado. Confirme o e-mail recebido e depois entre por aqui.","entrar");
      }
      const j=await http("/auth/v1/token?grant_type=password",{method:"POST",body:{email,password:senha}});
      saveS(norm(j));await boot();
    }catch(er){$("#lm").textContent=er.message;b.disabled=false}
  };
}
function telaSemPerfil(motivo){

async function brandLogin(){
  const slug=(new URLSearchParams(location.search).get("a")||ls.get("atr_slug")||"").toLowerCase();if(!slug)return;
  try{
    const j=await rpc("atrativo_publico",{p_slug:slug});if(!j)return;
    ls.set("atr_slug",j.slug);const p=j.pers||{},lg=document.querySelector(".login");if(!lg)return;
    document.querySelectorAll(".lgbrand,.box h1").forEach(e=>e.textContent=j.nome);
    if(p.bg)lg.style.backgroundImage=`url(${p.bg})`;
    if(p.cor){const r=document.documentElement.style;r.setProperty("--ac",p.cor);r.setProperty("--soft","color-mix(in srgb,"+p.cor+" 16%,transparent)")}
    document.title=j.nome;
  }catch(e){}
}
async function boot(){
  if(!S)return telaLogin();
  try{
    const u=await rest("usuarios?select=*&id=eq."+S.user.id);ME=u[0];
  }catch(e){if(!S)return telaLogin();return telaLogin(e.message)}
  if(!ME)return telaSemPerfil();
  if(!ME.ativo)return telaSemPerfil("Seu acesso foi desativado. Fale com o responsável.");
  try{await carregaBase()}catch(e){return telaLogin(e.message)}
  view="home";cfgMode=false;day=hoje();sub={};montaApp();iniciaAlertas();
}

/* ================= Reservas: regras de ação ================= */
const dentroPrazo=r=>Date.now()<new Date(r.criada_em).getTime()+2*3600*1000;
function podeAgir(r){
  if(r.status==="cancelada")return false;
  if(ME.tipo==="agencia")return dentroPrazo(r);
  return true;
}
function acoes(r){
  RES[r.id]=r;
  if(ME.tipo==="financeiro")return "";
  if(r.status==="cancelada")return "";
  if(!podeAgir(r))return `<span class="lock">🔒 somente consulta — peça alteração ao atrativo</span>`;
  const b=[];
  if(equipe())b.push(`<button data-a="status" data-id="${r.id}">${r.status==="confirmada"?"↩ Pendente":"✓ Confirmar"}</button>`);
  if(ME.tipo!=="atendente")b.push(`<button data-a="pax" data-id="${r.id}">✎ Pax</button>`);
  b.push(`<button data-a="mover" data-id="${r.id}">↔ Mover</button>`,`<button data-a="cancelar" data-id="${r.id}">✕ Cancelar</button>`);
  return b.join("");
}
const chip=(r,hora)=>`<div class="r${r.status==="cancelada"?" del":""}">${hora?`<span class="hr">${hh(r.horario)}</span>`:""}<span><small>Reserva</small> ${r.numero}</span><span><small>Adulto</small> ${r.adultos}</span><span><small>Chd</small> ${r.criancas}</span>${gestao()&&rec("cortesia")?`<span><small>Cort</small> ${r.cortesias}</span>`:""}${equipe()?`<span><small>Agência</small> ${esc(agNome(r.agencia_id))}</span>`:""}<span><small>Turista</small> ${esc(r.turista)}</span><span><small>Valor</small> ${brl(r.valor_total)}</span><span class="st st-${r.status}">${r.status}</span><span class="ac">${acoes(r)}</span></div>`;

async function vAgenda(){
  const d=day;
  const [vagas,res]=await Promise.all([
    rpc("vagas_do_dia",{p_atividade:ATV.id,p_data:d}),
    rest("reservas?select=*&atividade_id=eq."+ATV.id+"&data=eq."+d+(mostraCanc?"":"&status=neq.cancelada")+"&order=numero")]);
  const dt=new Date(d+"T12:00:00");
  const linhas=vagas.filter(v=>equipe()||v.ativo||res.some(r=>hh(r.horario)===hh(v.horario))).map(v=>{
    const h=hh(v.horario),rs=res.filter(r=>hh(r.horario)===h),lot=v.ativo&&v.livres===0;
    return `<div class="row${v.ativo||rs.length?"":" off"}"><div class="h${v.ativo?" hab":""}">${h}</div><div class="rs">${rs.map(r=>chip(r)).join("")}</div><div class="t${lot?" lot":""}">${v.ativo?`<b>${v.ocupadas}/${v.limite}</b><small>${lot?"lotado":v.livres+" livres"}</small>`:(v.ocupadas||"")}</div></div>`;
  }).join("");
  $("#main").innerHTML=`<div class="datebar"><button data-a="dia" data-n="-1">‹</button><input type="date" id="dt" value="${d}"><button data-a="dia" data-n="1">›</button></div>
  <p class="dtxt">${dt.getDate()} de ${cap(dt.toLocaleDateString("pt-BR",{month:"long"}))} de ${dt.getFullYear()}, ${cap(dt.toLocaleDateString("pt-BR",{weekday:"long"}))}</p>
  <div class="bar"><label>Adultos<input type="number" id="adt" min="1" inputmode="numeric"></label><label>Crianças<input type="number" id="chd" min="0" value="0" inputmode="numeric"></label>${rec("cortesia")?`<label>Cortesias<input type="number" id="cort" min="0" value="0" inputmode="numeric"></label>`:""}<button class="pri" data-a="consultar">Consultar</button>${equipe()?`<label class="chk"><input type="checkbox" id="mc"${mostraCanc?" checked":""}> mostrar canceladas</label>`:""}</div>
  <div class="msg" id="msg"></div><div class="scroll"><div class="grade">${linhas||'<p class="vazio">Sem horários abertos.</p>'}</div></div>`;
  $("#dt").onchange=e=>{day=e.target.value||day;go("agenda")};
  const mc=$("#mc");if(mc)mc.onchange=e=>{mostraCanc=e.target.checked;go("agenda")};
}

const TBN={reservas:"Reserva",agencias:"Agência",tarifas:"Tarifa",usuarios:"Usuário",atividades:"Atividade",horarios_operacao:"Horário",recebimentos_mp:"Comprovante MP",faturas:"Fatura",configuracoes:"Configuração"};
function labelAud(x){
  const d=x.depois||{},a=x.antes||{};
  if(x.tabela==="reservas"){const n=d.numero||a.numero;
    if(x.acao==="INSERT")return `Reserva nº ${n} criada (${brd(d.data)} ${hh(d.horario||"00:00")}, ${agNome(d.agencia_id)}, ${d.turista})`;
    if(d.status==="cancelada"&&a.status!=="cancelada")return `Reserva nº ${n} cancelada`;
    if(a.status!==d.status)return `Reserva nº ${n}: status ${d.status}`;
    if(a.data!==d.data||a.horario!==d.horario)return `Reserva nº ${n} movida para ${brd(d.data)} ${hh(d.horario||"00:00")}`;
    return `Reserva nº ${n} alterada`;}
  if(x.tabela==="agencias"){const n=d.nome_fantasia||a.nome_fantasia;
    if(x.acao==="INSERT")return `Agência ${n} cadastrada`;
    if(d.bloqueada!==a.bloqueada)return `Agência ${n} ${d.bloqueada?"bloqueada":"desbloqueada"}`;
    return `Agência ${n} alterada`;}
  if(x.tabela==="usuarios"){const n=d.nome||a.nome;return x.acao==="INSERT"?`Usuário ${n} criado`:`Usuário ${n} alterado`}
  return `${TBN[x.tabela]||x.tabela} ${x.acao==="INSERT"?"criado(a)":x.acao==="DELETE"?"removido(a)":"alterado(a)"}`;
}

async function consultaDisp(d,adt,chd,cort,volta){
  const n=adt+chd+cort;
  if(!d)return msg("Escolha a data.",1);
  if(d<hoje())return msg("Escolha uma data de hoje em diante.",1);
  if(adt<1)return msg("Informe ao menos 1 adulto.",1);
  let hs;try{hs=await rpc("horarios_disponiveis",{p_atividade:ATV.id,p_data:d,p_pessoas:n})}catch(e){return msg(e.message,1)}
  if(!hs.length)return msg(`Não há horários disponíveis para ${n} pessoa(s) em ${brd(d)}.`,1);
  msg("");
  const ags=AGS.filter(a=>!a.bloqueada&&a.ativa);
  ask("Horários disponíveis",`<p class="sub">${esc(ATV.nome)} · ${brd(d)} · ${n} pessoa(s)</p>${hs.map(h=>`<label class="chk"><input type="radio" name="h" value="${hh(h.horario)}" required> ${hh(h.horario)}${h.recomendado?" <b>★ Recomendado</b>":""} <small>(${h.livres} vagas)</small></label>`).join("")}<label>Turista<input name="tur" required></label>${equipe()?`<label>Agência${sel("ag",`<option value="">Selecione uma agência</option>${ags.map(a=>`<option value="${a.id}">${esc(a.nome_fantasia)}</option>`).join("")}`)}</label>`:""}`,"Reservar",async f=>{
    const r=await ins("reservas",{atividade_id:ATV.id,data:d,horario:f.get("h"),agencia_id:equipe()?f.get("ag"):ME.agencia_id,turista:f.get("tur").trim(),adultos:adt,criancas:chd,cortesias:cort});
    await go(volta);msg(`Reserva nº ${r[0].numero} criada para ${brd(d)} às ${f.get("h")} — ${brl(r[0].valor_total)}.`);
  });
}

/* ================= Alertas de nova reserva ================= */
let tAl=null,tBeep=null,alertas=[],vistos=new Set(),ultimoBeep=0,actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){
  try{unlockAudio();if(!actx)return;const t=actx.currentTime;
    [[880,0],[1175,.18]].forEach(([fr,dl])=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=fr;o.type="sine";g.gain.setValueAtTime(.0001,t+dl);g.gain.exponentialRampToValueAtTime(.35,t+dl+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dl+.3);o.connect(g).connect(actx.destination);o.start(t+dl);o.stop(t+dl+.32)});
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }catch(e){}
}
function iniciaAlertas(){
  clearInterval(tAl);clearInterval(tBeep);alertas=[];vistos=new Set();
  if(!equipe())return;
  pollAlertas();tAl=setInterval(pollAlertas,10000);
  tBeep=setInterval(()=>{if(alertas.length&&CFGAL.ativo&&CFGAL.som&&Date.now()-ultimoBeep>=(CFGAL.intervalo_segundos||30)*1000){ultimoBeep=Date.now();beep()}},1000);
}
async function pollAlertas(){
  if(!ME||!equipe()||!CFGAL.ativo){alertas=[];desenhaAlertas();return}
  try{alertas=await rest("alertas_reserva?select=id,criado_em,reservas(numero,data,horario,turista,adultos,criancas,cortesias,agencias(nome_fantasia))&confirmado_em=is.null&usuario_id=eq."+ME.id+"&order=criado_em")}catch(e){return}
  const novos=alertas.filter(a=>!vistos.has(a.id));
  if(novos.length){
    novos.forEach(a=>vistos.add(a.id));ultimoBeep=Date.now();if(CFGAL.som)beep();
    const a=novos[0],r=a.reservas;
    try{if(r&&"Notification" in window&&Notification.permission==="granted")new Notification("Nova reserva nº "+r.numero,{body:`${r.agencias?r.agencias.nome_fantasia:""} · ${r.turista} · ${brd(r.data)} ${hh(r.horario)}`,tag:a.id,requireInteraction:true})}catch(e){}
    if(view==="agenda"||view==="home")go(view);
  }
  desenhaAlertas();
}
function desenhaAlertas(){
  $("#alertas").innerHTML=alertas.map(a=>{const r=a.reservas||{};return `<div class="alerta"><span>🔔 <b>Nova reserva nº ${r.numero||""}</b> · ${esc(r.agencias?r.agencias.nome_fantasia:"")} · ${esc(r.turista||"")} · ${(r.adultos||0)+(r.criancas||0)+(r.cortesias||0)} pessoa(s) · ${brd(r.data)} ${r.horario?hh(r.horario):""}</span><button data-a="okAlerta" data-id="${a.id}">Confirmar</button></div>`}).join("");
}
A.okAlerta=async d=>{try{await upd("alertas_reserva","id=eq."+d.id,{confirmado_em:new Date().toISOString()});await pollAlertas()}catch(e){alert(e.message)}};
